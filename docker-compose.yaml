services:
  db:
    image: postgres:16-alpine
    container_name: flow-bank-db
    environment:
      POSTGRES_DB: flowbank
      POSTGRES_USER: flowbank
      POSTGRES_PASSWORD: flowbank
    ports:
      - "5433:5432"
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowbank -d flowbank"]
      interval: 5s
      timeout: 5s
      retries: 5